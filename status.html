<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Site Status</title><meta name="robots" content="noindex"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><style>body{font-family:system-ui,Arial,sans-serif;max-width:640px;margin:40px auto;padding:24px;line-height:1.4;background:#0b0f17;color:#e7edf5}code{background:#1e2733;padding:2px 5px;border-radius:4px;font-size:.9em}h1{font-size:1.6rem;margin-top:0}section{margin-top:2rem;border-top:1px solid #243040;padding-top:1.2rem}button{background:#2563eb;color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer}button:hover{background:#1d4ed8}pre{background:#111a23;padding:12px;border-radius:6px;overflow:auto;font-size:.85rem}</style></head><body><h1>FrameHouseCinema Status</h1><p>This page helps diagnose why the main site might not load.</p><div id="results"></div><section><h2>Environment Checks</h2><ul id="checks"></ul><button id="rerun">Run Again</button></section><section><h2>Next Steps If Failing</h2><ol><li>Try mobile data (not Wi‑Fi).</li><li>Flush DNS: <code>ipconfig /flushdns</code></li><li>Change DNS temporarily to 1.1.1.1 / 8.8.8.8.</li><li>Use HTTPS only.</li></ol></section><script>(function(){async function test(){const checks=document.getElementById('checks');checks.innerHTML='';const add=(k,v,ok=true)=>{const li=document.createElement('li');li.textContent=`${k}: ${v}`;li.style.color=ok?'#34d399':'#f87171';checks.appendChild(li);};add('Time (UTC)', new Date().toISOString());add('User Agent', navigator.userAgent.slice(0,120));add('Online', navigator.onLine);try{const r=await fetch('index.html?cb=' + Date.now(),{cache:'no-store'});add('Fetch index.html', r.status + ' ' + r.statusText, r.ok);const txt=await r.text();add('Index size (chars)', txt.length, txt.length>200);}catch(e){add('Fetch index.html','ERROR '+e.message,false);}try{const img=new Image();const p=new Promise((res,rej)=>{img.onload=()=>res(true);img.onerror=()=>rej('error');});img.src='Media/scenery/IMG_3210.JPG?cb=' + Date.now();await p;add('Sample image load','success');}catch(e){add('Sample image load','fail',false);}try{const storageTest='fhc_'+Date.now();localStorage.setItem(storageTest,'1');localStorage.removeItem(storageTest);add('localStorage writable','yes');}catch(e){add('localStorage writable','no',false);} }document.getElementById('rerun').addEventListener('click',test);test();})();</script></body></html>
