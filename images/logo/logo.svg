<?xml version="1.0" encoding="UTF-8"?>
<svg width="320" height="80" viewBox="0 0 320 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>FrameHouseCinema Logo</title>
  <defs>
    <!-- Background panel gradient -->
    <linearGradient id="panel" x1="0" y1="0" x2="320" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e4eefb"/>
      <stop offset="1" stop-color="#d4e4f4"/>
    </linearGradient>
    <!-- Accent stroke gradient -->
    <linearGradient id="border" x1="0" y1="0" x2="320" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#88bdf7"/>
      <stop offset="1" stop-color="#3d8fe6"/>
    </linearGradient>
    <!-- Text gradient (subtle cinematic blue) -->
    <linearGradient id="textGrad" x1="40" y1="20" x2="280" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#004d99"/>
      <stop offset="0.45" stop-color="#0d6dc7"/>
      <stop offset="1" stop-color="#3aa0ff"/>
    </linearGradient>
    <filter id="softGlow" x="-25%" y="-40%" width="150%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.30  0 0 0 0 0.55  0 0 0 0.35 0" result="c"/>
      <feBlend in="SourceGraphic" in2="c" mode="screen"/>
    </filter>
    <!-- Monogram mark (FHC) path for reuse -->
    <symbol id="monogram" viewBox="0 0 42 42">
      <rect x="1" y="1" width="40" height="40" rx="9" fill="url(#panel)" stroke="url(#border)" stroke-width="1.2"/>
      <path d="M11 28V13h14v4H16v3h8v4h-8v4h-5Zm17 0V13h5v15h-5Zm5 0h6v4h-6v-4Zm-22 0h6v4h-6v-4Z" fill="url(#textGrad)"/>
    </symbol>
  </defs>
  <!-- Background panel -->
  <rect x="0.75" y="0.75" width="318.5" height="78.5" rx="14" fill="url(#panel)" stroke="url(#border)" stroke-width="1.5"/>
  <!-- Monogram left -->
  <use href="#monogram" x="14" y="19" width="42" height="42"/>
  <!-- Brand text -->
  <g filter="url(#softGlow)">
    <text x="105" y="44" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="600" fill="url(#textGrad)" letter-spacing="0.5">FrameHouseCinema</text>
    <text x="105" y="60" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#326FAF" letter-spacing="4" style="text-transform:uppercase;">film & photo</text>
  </g>
  <!-- Accessibility title/desc -->
  <title>FrameHouseCinema – Film & Photo</title>
  <desc>Logo with gradient monogram and cinematic blue wordmark.</desc>
</svg>
